# Metres, radians. World X forward, Y left, Z up. Stop launch before changing.
first_arm: right
cloud_topic: /head_camera/points
cloud_timeout: 15.0
max_data_age: 2.0
roi_min: [0.47, -0.23, 0.721]
roi_max: [0.53, -0.17, 0.738]
table_z: 0.72
cluster_radius: 0.003
min_points: 20
max_points: 30000
bolt_length: 0.035
shaft_radius: 0.004
head_radius: 0.006
head_length: 0.006
grasp_offset: 0.010
open_width: 0.035
close_width: 0.004
approach_height: 0.05
# Before closing: measured TCP reach, then at most one complete correction.
grasp_reach_tolerance: 0.003
grasp_recovery_max: 0.025
lift_height: 0.05
cartesian_step: 0.003
descent_speed: 0.008
transfer_speed: 0.025
scan_speed: 0.015
joint_speed: 0.12
joint_acceleration: 0.15
# Relaxed for the near-singular vertical pick; logs report the actual maximum.
joint_step_limit: 0.20
inspection_center: [0.25, 0.0, 1.15]
handover_center: [0.25, 0.0, 1.15]
# Each view is reached from neutral and returns to neutral. No accumulating wrist turns.
views_deg: [[0, 0, 0], [0, 0, -30], [0, 15, 0], [0, -15, 0], [0, 35, 0], [0, -35, 0], [15, 0, 0], [-15, 0, 0], [60, 0, 0], [-60, 0, 0], [120, 0, 0], [-120, 0, 0], [180, 0, 0], [0, 0, 60], [0, 0, -60], [0, 0, 120], [0, 0, -120], [0, 0, 180]]
minimum_views: 3
settle_seconds: 0.8
center_tolerance: 0.003
angular_tolerance: 0.12
output_directory: ~/fr3_inspection_runs
simulation_entity: bolt_00_00
cameras:
  waist_camera:
    parent: support_link
    xyz: [0.085, 0.0, 1.22]
    rpy: [0.0, 0.401, 0.0]
    width: 1280
    height: 720
    horizontal_fov: 1.211
    near: 0.10
    far: 2.0
    rate: 10.0
  left_d435i:
