# metres / radians. Right mount reproduces fr3_bolt_cell; left is opposite.
# These are layout defaults, not surveyed real robot base/TCP calibration.
left:
  xyz: [0.0, 0.10, 1.10]
  rpy: [-1.5707963267948966, 0.0, 0.0]
  initial: [-1.57079632679, -1.2, 1.8, -0.6, 1.57079632679, 0.0]
right:
  xyz: [0.0, -0.10, 1.10]
  rpy: [1.5707963267948966, 0.0, 0.0]
  initial: [1.57079632679, -1.2, 1.8, -0.6, -1.57079632679, 0.0]
gripper:
  # q = each finger's inward travel. gap = open_gap - 2*q.
  # 0=open, increasing q=close, consistent with HKV normalized direction.
  open_gap: 0.030
  finger_travel: 0.015
  flange_xyz: [0.0, 0.0, 0.10]
  flange_rpy: [0.0, 0.0, 0.0]
  tcp_xyz: [0.0, 0.0, 0.145]
  tcp_rpy: [0.0, 0.0, 0.0]
